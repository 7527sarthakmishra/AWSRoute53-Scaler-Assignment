services:
  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: sqlite:////app/data/route53_clone.db
      FRONTEND_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      DEMO_USER_EMAIL: admin@example.com
      DEMO_USER_PASSWORD: route53demo
    ports:
      - "8000:8000"
    volumes:
      - route53_data:/app/data

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000/api
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  route53_data:
